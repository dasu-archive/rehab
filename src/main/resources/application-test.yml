spring:
  application:
    name: demo

  config:
    import: file:.env[.properties]

  datasource:
    url : ${DB_TEST_URL}
    username: ${DB_TEST_USERNAME}
    password: ${DB_TEST_PASSWORD}
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: ${DB_TEST_DDL_AUTO}
      generate_statistics: true
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: ${DB_SQL_INIT_MODE}